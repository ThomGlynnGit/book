<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <title>Library</title>
</head>
<body>
    <div class="container">
        <div id="card-container"></div>
        <button type="button" id="add">Add a book</button>
        <button type="button" id="delete">Delete a book</button>
        <dialog id="book-dialog">
            <form>
                <div class="form-row">
                    <label for="title">Title</label>
                    <input id="title" name="title" type="text">
                </div>
                <div class="form-row">
                    <label for="author">Author</label>
                    <input id="author" name="author" type="text">
                </div>
                <div class="form-row">
                    <label for="pages">Pages</label>
                    <input id="pages" name="pages" type="number">
                </div>
                <div class="form-row">
                    <legend>Have you read the book?</legend>
                    <input id="read" 
                        name="read" 
                        type="radio" 
                        value="read" />
                    <label for="read" class="radio-label">Read</label>
                    <input id="read" 
                        name="read" 
                        type="radio" 
                        value="not-read" />
                    <label for="not-read" class="radio-label">Not read</label> 
                </div>
                <button value="cancel" formmethod="dialog">Cancel</button>
                <button value="default" id="submit-btn">Submit</button>
            </form>
            
        </dialog>
    </div>
    
</body>
</html>
